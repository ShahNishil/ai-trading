# AI Trading System Configuration
# ================================

dhan:
  trading_mode: paper  # paper | live
  ip_address: ""       # Set your IP for Dhan API access

groq:
  model: "openai/gpt-oss-20b"  # Free Groq model (was llama-3.3-70b-versatile — decommissioned 2025)
  temperature: 0.1     # Low temperature for consistent analysis
  max_tokens: 2048

# AI Triggers Settings
triggers:
  watchlist: "NIFTY50"          # NIFTY50 | NIFTYBANK | BANKNIFTY | custom
  custom_symbols: []            # Used when watchlist=custom
  confidence_threshold: 0.50    # Minimum confidence to show trigger (lowered from 0.65 for more results)
  analysis_timeframe: "daily"   # daily | 60min | 15min
  lookback_days: 200            # Days of historical data for analysis

# Auto Trading Settings
auto_trade:
  enabled: false                # Master switch
  max_positions: 5              # Max concurrent open positions
  risk_per_trade_pct: 2.0       # % of capital risked per trade
  max_daily_loss_pct: 5.0       # Auto-halt if daily loss exceeds this
  min_confidence: 0.70          # Minimum AI confidence to execute trade
  scan_interval_seconds: 300    # How often to scan (5 min default)
  stop_loss_pct: 2.0            # Default stop-loss percentage
  target_pct: 4.0               # Default target percentage
  trailing_stop_pct: 1.5        # Trailing stop activation percentage
  product_type: "INTR"          # INTR | CNC | MTF
  order_type: "LIMIT"           # LIMIT | MARKET

# Backtesting Settings
backtest:
  initial_capital: 100000       # Starting capital in INR
  default_timeframe: "daily"    # daily | 60min | 15min | 5min | 1min
  commission_pct: 0.03          # Brokerage percentage
  slippage_pct: 0.05            # Slippage percentage
  default_strategy: "momentum"  # momentum | mean_reversion | breakout | ai

# Derivatives (F&O) Settings
# Real contract data & live execution require Dhan credentials in `.env`.
# Option-strategy backtesting works with underlying spot data (e.g. ^NSEI via yfinance)
# using Black-Scholes pricing, so it works even without Dhan.
derivatives:
  default_underlying: "NIFTY"   # NIFTY | BANKNIFTY | FINNIFTY | MIDCPNIFTY | any stock F&O symbol
  market: "IDX"                 # IDX (index F&O) | STK (stock F&O)
  default_strategy: "long_straddle"
  iv_pct: 0.0                   # 0 = use realised vol from underlying data (annualised % otherwise)
  risk_free_rate_pct: 7.0
  entry_days_before_expiry: 5   # Enter option structures N days before expiry
  risk_per_trade_pct: 0.75      # % of capital risked per option structure
  max_lots_per_trade: 5
  futures_margin_pct: 12.0      # Futures margin as % of notional
  futures_margin_usage_pct: 60.0
  product_type: "INTR"          # INTR | CNC | MTF (F&O order product type)

